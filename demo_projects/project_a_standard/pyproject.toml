[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "project-a-standard"
version = "0.1.0"
description = "Demo project for uibridge — Python ComponentAW style"
requires-python = ">=3.9"
dependencies = [
    "pytest>=8.0.0",
    "playwright>=1.52.0",
]

[tool.setuptools.packages.find]
include = ["aaw*", "baw*", "pages*", "test_data*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
