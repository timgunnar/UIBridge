# .uibridge/adapter.yaml — 项目配置
# 放到企业项目根目录的 .uibridge/ 子目录下

# ── 项目基本信息 ──
project:
  language: java          # java | python
  test_framework: testng  # testng | junit | pytest
  build_tool: maven       # maven | gradle | pip
  base_package: ""        # 首次 seed_knowledge_base 时自动推断

# ── 生成代码输出目录（相对于项目根目录）──
output:
  component_aw_dir: "generated/components/"
  business_aw_dir: "generated/business/"
  test_dir: "generated/tests/"
  test_data_dir: "generated/data/"
